<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tools{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="preload" href="/static/fonts/jbmono-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/archivo-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Tools</span>
    </a>
    {% block headerextra %}{% endblock %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>🔒 Processed in memory · nothing stored · no logs · your files stay yours</span>
    <span class="footer-version">v{{ version }}</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
